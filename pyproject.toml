[project]
name = "tenderpilot"
version = "0.2.0"
description = "投标智航 / TenderPilot - 全流程智能招投标平台 (vNext)"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "litellm>=1.0",
    "openai>=1.0",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "onnxruntime>=1.20",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "mammoth>=1.8",
    "chardet>=5.0",
    "beautifulsoup4>=4.12",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "minio>=7.2",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0",                      # 密码哈希（bcrypt 直用，成本因子 12）
    "keyring>=25.0",                    # Windows 凭据管理器存储 secret（P0-2）
    "httpx>=0.27",
    "tenacity>=8.2",
    "loguru>=0.7",
    "jieba>=0.42",
    "openpyxl>=3.1",
    "jinja2>=3.1",
    "apprise>=1.8",
    # --- vNext: 官方协议 SDK 与可观测性 ---
    "mcp>=1.9.0,<2",                     # Model Context Protocol 官方 Python SDK (FastMCP v1 API)
    "a2a-sdk[fastapi]>=1.0.0",                     # A2A 官方 Python SDK（A2A spec 1.0）
    "ag-ui-protocol>=0.1.21",                      # AG-UI 官方 Python SDK（AG-UI spec 0.1.0）
    "sse-starlette>=2.1.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
]

[project.optional-dependencies]
# 重量级/平台相关依赖（本地向量模型、PDF 排版、MinerU 本地解析），
# 默认“完整开发安装”= pip install -e ".[dev]"，不强制安装这些重型包。
heavy = [
    "sentence-transformers>=3.0",
    "weasyprint>=61",
    "mineru>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "aiosqlite>=0.20",                  # 测试用本地 SQLite 异步驱动
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "services*"]
exclude = ["tests*", "scripts*"]
